# Přístupová pravidla PostgreSQL pro produkční stack (montuje se read-only jako hba_file).
# Oproti výchozímu souboru z initdb přibyl JEDINÝ řádek navíc: replikace po docker síti, aby šlo
# postavit hot standby repliku (docs/vps-reliability.md). Nic jiného se neuvolňuje.

# Provozní skripty mluví s databází přes unixový socket uvnitř kontejneru (docker compose exec -T db psql).
local   all             all                                     trust
local   replication     all                                     trust

# Smyčka uvnitř kontejneru (healthcheck pg_isready).
host    all             all             127.0.0.1/32            trust
host    all             all             ::1/128                 trust

# API i replika se připojují po docker síti — vždy s heslem, nikdy trust.
host    all             all             all                     scram-sha-256
host    replication     all             all                     scram-sha-256
