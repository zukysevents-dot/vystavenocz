# Single-box nasazení: nginx (SPA + reverse-proxy /api) → .NET API → PostgreSQL.
# Spuštění z adresáře vystavenocz:
# `DB_PASSWORD=<silné-heslo> JWT_SECRET=<min-32-znaků> STRIPE_SECRET_KEY=<sk_test...> INTEGRATIONS_SECRET_ENCRYPTION_KEY=<openssl rand -base64 32> docker compose up --build`
# Vyžaduje sousední repo ../vystaveno-api (build kontext API). App poběží na http://localhost:8080.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vystaveno
      POSTGRES_USER: vystaveno
      POSTGRES_PASSWORD: ${DB_PASSWORD:?nastav DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vystaveno']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../vystaveno-api
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      PORT: 8080
      Database__ConnectionString: 'Host=db;Database=vystaveno;Username=vystaveno;Password=${DB_PASSWORD:?nastav DB_PASSWORD}'
      Jwt__Secret: ${JWT_SECRET:?nastav JWT_SECRET (min. 32 znaků)}
      Stripe__SecretKey: ${STRIPE_SECRET_KEY:?nastav STRIPE_SECRET_KEY}
      Integrations__SecretEncryptionKey: ${INTEGRATIONS_SECRET_ENCRYPTION_KEY:?nastav INTEGRATIONS_SECRET_ENCRYPTION_KEY (openssl rand -base64 32)}
      # PINy obsluhy na pokladně: slepý index pro vyhledání vlastníka PINu v rámci firmy. Bez klíče
      # je celá PIN vrstva fail-closed 503 — nejde nastavit PIN, přihlásit se PINem ani použít
      # manažerský override u storna a slevy nad limit. Klíč NIKDY neměň za provozu: změnou se
      # rozejde index s uloženými PINy a nikdo se PINem nepřihlásí (PINy se musí nastavit znovu).
      Auth__PinLookupKey: ${AUTH_PIN_LOOKUP_KEY:-}
      # Jen pro interní billing/backoffice adaptér: bez klíče kvalifikace referralů i investor metriky fail-closed vrátí 503.
      Growth__OperatorKey: ${GROWTH_OPERATOR_KEY:-}
      BlobStorage__LocalRootPath: /var/lib/vystaveno/files
      Payments__PortalBaseUrl: ${PAYMENTS_PORTAL_BASE_URL:-http://localhost:8080}
      # SMTP pro odeslání faktur, pozvánek a nákupních objednávek. Bez EMAIL_HOST je v dev/testu
      # použit bezpečný logging sender; produkce pak nesmí tvrdit, že e-mail došel.
      Email__Host: ${EMAIL_HOST:-}
      Email__Port: ${EMAIL_PORT:-587}
      Email__From: ${EMAIL_FROM:-}
      Email__Username: ${EMAIL_USERNAME:-}
      Email__Password: ${EMAIL_PASSWORD:-}
      # Placené moduly: dokud se neplatí, drž Entitlements__Enforce=false — tarif pak neomezuje
      # nic (ani to, co vidí klient) a všechny moduly jsou dostupné. Zapnout AŽ po backfillu firem
      # a spuštění plateb; postup je v docs/product/module-migration-rollout.md.
      Entitlements__Enforce: ${ENTITLEMENTS_ENFORCE:-false}
      # Přihlášení přes Google. Prázdná hodnota = poskytovatel nenakonfigurovaný → /auth/external/*
      # vrací 503 a tlačítko poctivě řekne, že se přihlášení nepodařilo (fail-closed, nikdy falešný
      # úspěch). Client secret žije JEN tady na serveru, nikdy v SPA ani v mobilní aplikaci.
      OAuth__Google__ClientId: ${OAUTH_GOOGLE_CLIENT_ID:-}
      OAuth__Google__ClientSecret: ${OAUTH_GOOGLE_CLIENT_SECRET:-}
      OAuth__RedirectUri: ${OAUTH_REDIRECT_URI:-}
      # Rate limit. Festival má všechny bary za JEDNOU veřejnou IP, proto se přihlášený provoz počítá
      # na firmu (ne na IP) a jde doladit bez rebuildu. Výchozí hodnoty stačí i na velkou akci —
      # 3000/min je celofiremní strop a 120/min pokryje střídání obsluhy PINem na sdílených terminálech.
      # POZOR: limity jsou za MINUTU, ne za hodinu. Snižovat je nemá smysl, tohle je pojistka proti
      # rozběhlému klientovi. Limit `auth` (hádání hesel) tu ZÁMĚRNĚ není — heslové přihlášení nemá
      # zámek účtu, takže per-IP limit je jeho jediná ochrana a nesmí se kvůli provozu povolovat.
      RateLimit__Company: ${RATE_LIMIT_COMPANY:-3000}
      RateLimit__Pin: ${RATE_LIMIT_PIN:-120}
      # Veřejná HTTPS adresa, na kterou SumUp posílá oznámení o výsledku karetní platby
      # (callback jde na {base}/api/v1/webhooks/sumup/{token}, tedy přes nginx na /api/).
      # Prázdná hodnota NENÍ chyba: integrace funguje dál, jen se výsledek zjistí až dotazem
      # do SumUp API — tedy o pár vteřin později. Nikdy z ní neděláme povinnou proměnnou.
      # HTTP adresu backend ignoruje (callback musí být HTTPS).
      SumUp__PublicBaseUrl: ${SUMUP_PUBLIC_BASE_URL:-}
      # Web je same-origin přes nginx; desktop (Tauri) volá cross-origin → povol jeho originy (ops).
      Cors__AllowedOrigins__0: 'tauri://localhost'
      Cors__AllowedOrigins__1: 'http://tauri.localhost'
    depends_on:
      db:
        condition: service_healthy
    expose:
      - '8080'
    volumes:
      - api_files:/var/lib/vystaveno/files

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api/v1
    ports:
      - '8080:80'
    depends_on:
      - api

volumes:
  pgdata:
  api_files:
